<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finanças">
<link rel="preload" href="fonts/bricolage.woff2" as="font" type="font/woff2" crossorigin>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Finanças</title>
<style>
:root{
  color-scheme:dark;
  --bg:#0d1424;--card:#151e31;--card2:#1f2a42;--card3:#2b3955;
  --txt:#f2f5fb;--mut:#8d99b3;--line:rgba(255,255,255,.06);
  --ok:#3ddc97;--warn:#ffb547;--bad:#ff6b6b;--acc:#7c6cff;--accink:#ffffff;
  --navbg:rgba(21,30,49,.74);--sheetbg:rgba(19,27,45,.94);--scrim:rgba(4,8,18,.6);--glassedge:rgba(255,255,255,.09);
}
@media (prefers-color-scheme:light){
  :root{
    color-scheme:light;
    --bg:#f3f4fa;--card:#ffffff;--card2:#e9ecf5;--card3:#dadfec;
    --txt:#10172a;--mut:#6b7590;--line:rgba(16,23,42,.06);
    --ok:#12a86b;--warn:#d98a00;--bad:#e5484d;--acc:#6a5ae0;--accink:#ffffff;
    --navbg:rgba(255,255,255,.55);--sheetbg:rgba(255,255,255,.88);--scrim:rgba(0,0,0,.35);--glassedge:rgba(255,255,255,.85);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bounce:cubic-bezier(.34,1.56,.64,1)}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{padding:env(safe-area-inset-top) 0 calc(104px + env(safe-area-inset-bottom))}
.wrap{max-width:520px;margin:0 auto;padding:16px;animation:rise .32s cubic-bezier(.32,.72,0,1)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
h1{font-size:28px;margin:6px 0 4px;font-weight:800;letter-spacing:-.02em}
h2{font-size:20px;margin:26px 2px 10px;color:var(--txt);font-weight:700;letter-spacing:-.01em;display:flex;justify-content:space-between;align-items:baseline}
h2 small{font-size:14px;font-weight:500;color:var(--acc)}
/* hero: régua do mês (dinheiro usado x dias passados) */
.hero{padding:20px 18px 18px}
.hero .big{font-size:46px;line-height:1.05;margin:4px 0 14px}
.regua{position:relative;height:12px;border-radius:99px;background:var(--card2);overflow:visible}
.regua>i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;transition:width .6s cubic-bezier(.32,.72,0,1)}
.regua>b{position:absolute;top:-5px;bottom:-5px;width:3px;border-radius:2px;background:var(--txt);transform:translateX(-1.5px)}
.regua-leg{display:flex;justify-content:space-between;gap:10px;margin-top:9px;font-size:13px;color:var(--mut)}
.ritmo{margin-top:12px;font-size:15px;line-height:1.35}
/* linhas de lista */
.lin{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--card2)}
.lin:last-child{border:0}
.lin[onclick]:active{opacity:.6}
.lin .ico{flex-shrink:0;width:36px;height:36px;border-radius:11px;background:var(--card2);display:flex;align-items:center;justify-content:center;color:var(--txt)}
.lin .dia{flex-shrink:0;width:36px;text-align:center;line-height:1.05}
.lin .dia b{display:block;font-size:18px}.lin .dia span{font-size:11px;color:var(--mut)}
.lin .mid{flex:1;min-width:0}
.lin .tit{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lin .sub{font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.lin .val{flex-shrink:0;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:600;font-size:16px}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:99px;margin-top:4px}
.chip.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.chip.pend{background:var(--card2);color:var(--mut)}
.chip.late{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.diahead{font-size:13px;color:var(--mut);font-weight:600;margin:16px 4px 6px}
.diahead:first-child{margin-top:4px}
.filtro{display:flex;background:var(--card);border-radius:12px;padding:3px;margin-bottom:12px}
.filtro button{flex:1;border:0;background:none;color:var(--mut);font-size:14px;font-weight:600;padding:8px 4px;border-radius:9px;white-space:nowrap}
.filtro button.on{background:var(--card3);color:var(--txt)}
.trio{display:flex;gap:8px}.trio>div{flex:1;min-width:0}.trio b{display:block;font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px}
.big{font-size:38px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.mut{color:var(--mut);font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.bar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--ok);transition:width .5s cubic-bezier(.32,.72,0,1)}
.item{padding:13px 0;border-bottom:1px solid var(--card2);transition:transform .22s var(--bounce);animation:itemIn .4s var(--bounce) backwards}
.item:last-child{border:0}
.item[onclick]:active,.card[onclick]:active{transform:scale(.98);opacity:.85}
.item:nth-child(1){animation-delay:.02s}.item:nth-child(2){animation-delay:.05s}.item:nth-child(3){animation-delay:.08s}.item:nth-child(4){animation-delay:.11s}.item:nth-child(5){animation-delay:.14s}.item:nth-child(6){animation-delay:.17s}.item:nth-child(7){animation-delay:.2s}.item:nth-child(8){animation-delay:.23s}
@keyframes itemIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.tabular{font-variant-numeric:tabular-nums}
.sucesso-flash{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.4);width:64px;height:64px;border-radius:50%;background:var(--ok);display:flex;align-items:center;justify-content:center;z-index:20;pointer-events:none;animation:sucessoPop .75s var(--bounce) forwards;box-shadow:0 10px 30px -6px rgba(0,0,0,.4)}
.sucesso-flash path{stroke-dasharray:30;stroke-dashoffset:30;animation:drawCheck .4s .15s cubic-bezier(.65,0,.35,1) forwards}
@keyframes sucessoPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}35%{transform:translate(-50%,-50%) scale(1)}82%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
@keyframes drawCheck{to{stroke-dashoffset:0}}

.scrimbottom{position:fixed;left:0;right:0;bottom:0;height:130px;background:linear-gradient(to bottom, transparent, var(--bg) 65%);pointer-events:none;z-index:3}
nav{position:fixed;left:50%;transform:translateX(-50%);width:min(492px, calc(100% - 28px));bottom:calc(14px + env(safe-area-inset-bottom));background:var(--navbg);-webkit-backdrop-filter:blur(30px) saturate(190%);backdrop-filter:blur(30px) saturate(190%);border-radius:28px;border:.5px solid var(--glassedge);box-shadow:0 14px 34px -10px rgba(0,0,0,.4),inset 0 1px 0 var(--glassedge);display:flex;padding:4px;z-index:5}
.navind{position:absolute;top:4px;bottom:4px;left:0;border-radius:22px;background:color-mix(in srgb, var(--acc) 14%, transparent);transition:transform .4s var(--bounce),width .4s var(--bounce);pointer-events:none;z-index:0}
nav button{position:relative;z-index:1;flex:1;background:none;border:0;border-radius:22px;color:var(--mut);padding:8px 0 7px;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;transition:transform .22s var(--bounce)}
nav button:active{transform:scale(.9)}
nav button.on{color:var(--acc)}
nav .ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s var(--bounce)}
nav button.on .ic{transform:scale(1.08)}

.fab{position:fixed;right:18px;bottom:calc(96px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:linear-gradient(165deg, color-mix(in srgb, var(--acc) 85%, white 15%), var(--acc));color:var(--accink);border:0;box-shadow:0 8px 24px -4px color-mix(in srgb, var(--acc) 70%, transparent),inset 0 1px 0 rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;transition:transform .22s var(--bounce);z-index:4}
.fab:active{transform:scale(.88) rotate(90deg)}
.fab svg{width:26px;height:26px;stroke:currentColor;stroke-width:2.3;stroke-linecap:round}

input,select,button.btn{width:100%;background:var(--card2);color:var(--txt);border:0;border-radius:14px;padding:14px;font-size:17px;margin-bottom:10px;transition:transform .22s var(--bounce)}
input:focus,select:focus{outline:2px solid var(--acc)}
button.btn{background:linear-gradient(165deg, color-mix(in srgb, var(--acc) 85%, white 15%), var(--acc));color:var(--accink);font-weight:700;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
button.btn:active{transform:scale(.97)}
button.btn.sec{background:var(--card2);color:var(--txt);box-shadow:none}
button.btn.del{background:var(--bad);color:#fff;box-shadow:none}
.seg{display:flex;gap:8px;margin-bottom:10px}
.seg button{flex:1;padding:12px;border-radius:12px;border:0;background:var(--card2);color:var(--mut);font-size:15px;transition:transform .22s var(--bounce),background .2s}
.seg button:active{transform:scale(.96)}
.seg button.on{background:linear-gradient(165deg, color-mix(in srgb, var(--acc) 85%, white 15%), var(--acc));color:var(--accink);font-weight:700;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chips button{padding:10px 14px;border-radius:99px;border:0;background:var(--card2);color:var(--txt);font-size:14px;transition:transform .22s var(--bounce),background .2s}
.chips button:active{transform:scale(.94)}
.chips button.on{background:linear-gradient(165deg, color-mix(in srgb, var(--acc) 85%, white 15%), var(--acc));color:var(--accink);font-weight:700;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}

.modal{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-end;z-index:9;opacity:0;pointer-events:none;transition:opacity .25s}
.modal.show{opacity:1;pointer-events:auto}
.sheet{background:var(--sheetbg);-webkit-backdrop-filter:blur(24px) saturate(170%);backdrop-filter:blur(24px) saturate(170%);width:100%;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;border-top:.5px solid var(--glassedge);padding:14px 18px calc(24px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto;transform:translateY(24px);transition:transform .32s cubic-bezier(.32,.72,0,1)}
.modal.show .sheet{transform:translateY(0)}
.grabber{width:36px;height:5px;border-radius:3px;background:var(--card3);margin:2px auto 14px}
.x{float:right;background:none;border:0;color:var(--mut);font-size:26px;margin:-30px -4px 0 0}
.hidden{display:none}
.empty{text-align:center;color:var(--mut);padding:24px 0}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}

/* cartões: visual tipo Apple Wallet */
.ccgrid{display:flex;flex-direction:column;gap:12px;margin-bottom:14px}
.ccard{position:relative;border-radius:20px;padding:20px;color:#fff;overflow:hidden;min-height:108px;box-shadow:0 12px 28px -12px rgba(0,0,0,.6);transition:transform .22s var(--bounce);animation:itemIn .4s var(--bounce) backwards}
.ccard[onclick]:active{transform:scale(.97)}
.ccard::before{content:"";position:absolute;inset:0;background:radial-gradient(130% 100% at 12% -10%,rgba(255,255,255,.28),transparent 55%);pointer-events:none}
.ccard.big{min-height:148px;margin-bottom:12px}
.ccname{font-weight:700;font-size:16px;letter-spacing:-.01em;position:relative}
.ccnum{font-size:14px;opacity:.88;margin-top:26px;font-variant-numeric:tabular-nums;letter-spacing:.08em;position:relative;display:block}
.ccrow{display:flex;justify-content:space-between;align-items:flex-end;margin-top:26px;position:relative}
.ccfat{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.ccbar{height:5px;background:rgba(255,255,255,.3);border-radius:99px;margin-top:10px;overflow:hidden;position:relative}
.ccbar>i{display:block;height:100%;background:#fff;border-radius:99px;transition:width .5s cubic-bezier(.32,.72,0,1)}
.swatch{width:40px;height:40px;padding:0!important;border-radius:50%!important;border:2px solid transparent}
.swatch.on{border-color:var(--txt)}

/* consultor em chat: bolha flutuante + tela cheia */
.fabChat{bottom:calc(166px + env(safe-area-inset-bottom));width:50px;height:50px;background:var(--card2);color:var(--acc);border:1px solid color-mix(in srgb,var(--acc) 40%,transparent);box-shadow:0 8px 20px -6px rgba(0,0,0,.5)}
.fabChat svg{width:22px;height:22px}
.fabChat.badge::after{content:"";position:absolute;top:3px;right:3px;width:11px;height:11px;border-radius:50%;background:var(--bad);border:2px solid var(--bg)}
.chatOverlay{position:fixed;inset:0;background:var(--bg);z-index:11;display:flex;flex-direction:column;opacity:0;transform:translateY(16px);transition:opacity .28s cubic-bezier(.32,.72,0,1),transform .28s cubic-bezier(.32,.72,0,1);padding-top:env(safe-area-inset-top)}
.chatOverlay.show{opacity:1;transform:translateY(0)}
.chatHead{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--card2);flex-shrink:0}
.chatTitle{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px;color:#9a6bf0}
.chatHead .x{position:static;float:none;font-size:24px;margin:0}
.chatMsgs{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.chatRow{display:flex;flex-direction:column;max-width:82%}
.chatRow.mine{align-self:flex-end;align-items:flex-end}
.chatRow.theirs{align-self:flex-start;align-items:flex-start}
.chatRow.ia{align-self:flex-start;flex-direction:row;align-items:flex-end;gap:6px;max-width:88%}
.chatAutor{font-size:11px;color:var(--mut);margin:0 4px 2px}
.chatAcoes{display:flex;gap:6px;margin-top:6px}
.chatAcoes button{border:0;background:var(--card2);color:var(--txt);font-size:13px;font-weight:600;padding:6px 12px;border-radius:99px}
.conversa{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:99px;padding:6px 6px 6px 16px;margin-bottom:12px}
.conversa input{flex:1;margin:0;padding:10px 0;background:none;font-size:16px;border-radius:0}
.conversa input:focus{outline:none}
.conversa button{flex-shrink:0;width:38px;height:38px;border-radius:50%;border:0;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center}
.chatBubble{padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.35;white-space:pre-wrap;word-break:break-word}
.chatBubble.mine{background:linear-gradient(165deg, color-mix(in srgb, var(--acc) 85%, white 15%), var(--acc));color:var(--accink);border-bottom-right-radius:5px}
.chatBubble.theirs{background:var(--card2);color:var(--txt);border-bottom-left-radius:5px}
.chatBubble.ia{background:rgba(154,107,240,.14);color:var(--txt);border-bottom-left-radius:5px}
.chatIaIc{color:#9a6bf0;flex-shrink:0;margin-bottom:4px}
.chatInputBar{display:flex;gap:8px;align-items:center;padding:10px 14px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--card2);background:var(--bg);flex-shrink:0}
.chatInputBar input{margin:0;flex:1}
.chatSend{width:44px;height:44px;flex-shrink:0;border-radius:50%;background:linear-gradient(165deg,#9a6bf0,#6d28d9);color:#fff;border:0;display:flex;align-items:center;justify-content:center;transition:transform .22s var(--bounce)}
.chatSend:active{transform:scale(.88)}
.chatTyping{display:flex;gap:4px;padding:10px 14px}
.chatTyping span{width:6px;height:6px;border-radius:50%;background:var(--mut);animation:typingDot 1s infinite ease-in-out}
.chatTyping span:nth-child(2){animation-delay:.15s}
.chatTyping span:nth-child(3){animation-delay:.3s}
@keyframes typingDot{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}

@font-face{font-family:"Bricolage Grotesque";src:url(fonts/bricolage.woff2) format("woff2");font-weight:200 800;font-display:swap}
/* ---------- identidade: noite azul, números em Bricolage, cor por categoria ---------- */
.big,h1,h2,.trio b,.lin .val,.mesnav b,.lin .dia b{font-family:"Bricolage Grotesque",-apple-system,sans-serif}
.card{border-radius:22px;border:1px solid var(--line);background:var(--card)}
h1{font-size:30px;font-weight:800;letter-spacing:-.03em}
h2{font-size:21px;font-weight:700;letter-spacing:-.02em}
.mesnav{display:flex;align-items:center;justify-content:space-between;margin:2px 0 14px}
.mesnav b{font-size:22px;font-weight:700;letter-spacing:-.02em}
.mesnav button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:20px;display:flex;align-items:center;justify-content:center;padding:0}
.mesnav button:active{transform:scale(.9)}
/* hero: o brilho muda com o ritmo do mês */
.hero{position:relative;overflow:hidden;padding:22px 20px 20px;border-color:color-mix(in srgb,var(--glow) 26%,transparent)}
.hero::before{content:"";position:absolute;inset:-40% -30% auto auto;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--glow) 34%,transparent),transparent 68%);pointer-events:none}
.hero>*{position:relative}
.hero .mut{font-size:14px}
.hero .big{font-size:56px;font-weight:800;letter-spacing:-.045em;margin:2px 0 16px}
.hero .big small{font-size:.42em;font-weight:700;letter-spacing:0;margin-right:4px;color:var(--mut);vertical-align:.55em}
.regua{height:10px;background:color-mix(in srgb,var(--txt) 8%,transparent)}
.regua>b{background:var(--txt);box-shadow:0 0 0 3px var(--card)}
.ritmo{font-size:15px;display:flex;gap:8px;align-items:flex-start}
.ritmo i{flex-shrink:0;width:8px;height:8px;border-radius:50%;background:var(--glow);margin-top:6px;box-shadow:0 0 10px var(--glow)}
/* bolhas de categoria */
.bolha{flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;border-radius:12px;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent)}
.lin .ico{background:none;width:auto;height:auto}
.lin .dia{width:40px;padding:5px 0;border-radius:12px;background:var(--card2)}
.lin .dia b{font-size:17px}
.lin .val{font-size:16px;font-weight:700}
.catrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.catrow:last-child{border:0}
.catrow .mid{flex:1;min-width:0}
.catrow .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.catrow .top>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catrow .top>span:last-child{flex-shrink:0;white-space:nowrap}
.catrow .bar{height:6px;margin-top:8px;background:color-mix(in srgb,var(--txt) 7%,transparent)}
.lin{border-bottom-color:var(--line)}
.conversa{border:1px solid color-mix(in srgb,var(--acc) 35%,transparent);background:color-mix(in srgb,var(--acc) 9%,var(--card));padding-left:14px}
.conversa .spark{color:var(--acc);display:flex}
.conversa button{background:var(--acc)}
.trio>div{background:var(--card2);border-radius:14px;padding:10px 12px}
.trio{padding:10px}
.trio b{font-size:16px;margin-top:2px}
.filtro{border:1px solid var(--line)}
.diahead{font-size:14px}
nav{border-color:var(--glassedge)}
</style>
</head>
<body>
<svg style="position:absolute;width:0;height:0" aria-hidden="true">
<symbol id="i-home" viewBox="0 0 24 24"><path d="M3.5 11.5 12 4.2l8.5 7.3"/><path d="M5.5 10v9a1 1 0 0 0 1 1h4v-6.3h3V20h4a1 1 0 0 0 1-1v-9"/></symbol>

<script>
/* ---------- estado ---------- */
const KEY='financas.v1';
const CATS=[['comida','Comida'],['mercado','Mercado'],['transporte','Transporte'],['moradia','Moradia'],['lazer','Lazer'],['saude','Saúde'],['estudos','Estudos'],['compras','Compras'],['assinaturas','Assinaturas'],['outros','Outros']];
const CARD_COLORS=[['#6c6cf2','#3b2fb0'],['#38bdf8','#0369a1'],['#34d399','#047857'],['#fb7185','#9f1239'],['#fbbf24','#b45309'],['#94a3b8','#1e293b'],['#f472b6','#9d174d'],['#2dd4bf','#0f766e']];
/* Config pública do Firebase (não é segredo: toda config web do Firebase é
   pensada pra ir embutida no app; quem protege os dados são as regras do
   Firestore). Embutida aqui pra quem conectar não precisar colar nada. */
const FIREBASE_CFG={apiKey:"AIzaSyCIKXGNO5PSn5P2BYAiqLDZiC-uIAYfYgI",authDomain:"financas-casal-5faea.firebaseapp.com",projectId:"financas-casal-5faea",storageBucket:"financas-casal-5faea.firebasestorage.app",messagingSenderId:"30626929484",appId:"1:30626929484:web:ca608fa5e1240a3e340de9"};
/* Consultor com IA: chama um proxyzinho (Cloudflare Worker) que guarda a
   chave do Gemini em segredo no servidor e só aceita pedidos vindos deste
   site (checa a origem). O app nunca vê a chave real. */
const IA_PROXY_URL="https://financas-casal-ia.supleki-api.workers.dev";
const def={tx:[],orc:{},fixos:[],salario:0,rendas:[],metas:[],cartoes:[],distribuicao:[],mudanca:null,chat:[],ajustes:{}};
let S=load();
function load(){try{return Object.assign({},def,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return {...def}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let tab='hoje',mesRef=mesKey(new Date());

/* ---------- utils ---------- */
const R=v=>(v<0?'-':'')+'R$ '+Math.abs(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
function mesKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function hojeStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function diasNoMes(k){const[y,m]=k.split('-').map(Number);return new Date(y,m,0).getDate()}
function diasRestantes(k){const h=new Date();if(mesKey(h)!==k){return k>mesKey(h)?diasNoMes(k):1}return diasNoMes(k)-h.getDate()+1}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function ic(name,size=18){return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" style="stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px"><use href="#i-${name}"/></svg>`}
const CAT_COR={comida:'#ff9f43',mercado:'#2ed47a',transporte:'#4da3ff',moradia:'#ffc93c',lazer:'#ff6fb1',saude:'#ff7a7a',estudos:'#2ec4b6',compras:'#a78bfa',assinaturas:'#38d9f5',outros:'#94a3b8',renda:'#3ddc97'};
function catId(n){const c=CATS.find(c=>c[1]===n);return c?c[0]:(n==='Entrada'||n==='Renda'?'renda':'outros')}
function catBolha(n,size=38){const id=catId(n);return `<span class="bolha" style="--c:${CAT_COR[id]};width:${size}px;height:${size}px">${ic(id==='renda'?'renda':id,Math.round(size*.5))}</span>`}
function catIcon(n){const c=CATS.find(c=>c[1]===n);return ic(c?c[0]:'outros')}
function nomeMes(k){const[y,m]=k.split('-').map(Number);const s=new Date(y,m-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});return s.charAt(0).toUpperCase()+s.slice(1)}
function addMes(k,n){const[y,m]=k.split('-').map(Number);return mesKey(new Date(y,m-1+n,1))}
function mesesEntre(a,b){const[ay,am]=a.split('-').map(Number),[by,bm]=b.split('-').map(Number);return(by-ay)*12+(bm-am)}
function haptic(ms=10){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}
function flashSucesso(){
  const el=document.createElement('div');
  el.className='sucesso-flash';
  el.innerHTML='<svg viewBox="0 0 24 24" width="28" height="28"><path d="M4 12.5l5 5L20 7" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),750);
}

/* ---------- casal: sincronização via Firebase (opcional) ----------
   Sem config salva, o app funciona 100% local (como antes). Com config,
   cada lançamento/fixo/meta/cartão vira um documento em
   casais/{codigo}/<coleção>/{id}, espelhado em tempo real nos dois
   aparelhos. salário/orçamento ficam no próprio doc casais/{codigo}. */
let FS=null,db=null,auth=null,cloudCfg=null,cloudListeners=[];
function loadCloudCfg(){try{return JSON.parse(localStorage.getItem('financas.cloud')||'null')}catch(e){return null}}
function saveCloudCfg(c){try{localStorage.setItem('financas.cloud',JSON.stringify(c))}catch(e){}}
function cloudOn(){return !!db}
async function conectarCloud(cfg){
  const[{initializeApp},{getAuth,signInAnonymously},{getFirestore,doc,collection,onSnapshot,setDoc,deleteDoc,enableIndexedDbPersistence}]=await Promise.all([
    import('https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js'),
    import('https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js'),
    import('https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js'),
  ]);
  const app=initializeApp(cfg);
  auth=getAuth(app);
  db=getFirestore(app);
  try{await enableIndexedDbPersistence(db)}catch(e){}
  await signInAnonymously(auth);
  FS={doc,collection,onSnapshot,setDoc,deleteDoc};
  ligarListeners();
  if(pendingCloudSync){pendingCloudSync=false;sincronizarLocalParaCloud()}
}
function sincronizarLocalParaCloud(){
  ['tx','fixos','metas','cartoes','rendas','chat'].forEach(col=>{S[col].forEach(item=>cloudUpsert(col,item))});
  cloudSaveConfig();
}
function pararListeners(){cloudListeners.forEach(u=>{try{u()}catch(e){}});cloudListeners=[]}
function ligarListeners(){
  pararListeners();
  const codigo=cloudCfg.codigo;
  cloudListeners.push(FS.onSnapshot(FS.doc(db,'casais',codigo),snap=>{
    const d=snap.data();
    if(d){
      S.salario=d.salario||0;S.orc=d.orc||{};S.distribuicao=d.distribuicao||[];S.mudanca=d.mudanca||null;S.ajustes=d.ajustes||{};
      migrarSalarioParaRendas();
      recomputeOrcFromDistribuicao();save();render();
    }
  }));
  ['tx','fixos','metas','cartoes','rendas','chat'].forEach(col=>{
    cloudListeners.push(FS.onSnapshot(FS.collection(db,'casais',codigo,col),snap=>{
      const arr=[];snap.forEach(d=>arr.push({id:d.id,...d.data()}));
      S[col]=arr;save();render();
    }));
  });
}
let pendingCloudSync=false;
function cloudUpsert(col,item){
  if(!cloudOn()){if(cloudCfg)pendingCloudSync=true;return}
  const{id,...rest}=item;
  FS.setDoc(FS.doc(db,'casais',cloudCfg.codigo,col,String(id)),rest).catch(e=>console.error('[cloud]',e));
}
function cloudRemove(col,id){
  if(!cloudOn()){if(cloudCfg)pendingCloudSync=true;return}
  FS.deleteDoc(FS.doc(db,'casais',cloudCfg.codigo,col,String(id))).catch(e=>console.error('[cloud]',e));
}
function cloudSaveConfig(){
  if(!cloudOn()){if(cloudCfg)pendingCloudSync=true;return}
  FS.setDoc(FS.doc(db,'casais',cloudCfg.codigo),{salario:0,orc:S.orc,distribuicao:S.distribuicao,mudanca:S.mudanca,ajustes:S.ajustes||{}},{merge:true}).catch(e=>console.error('[cloud]',e));
}
function upsertItem(colKey,item){
  const arr=S[colKey];
  const idx=arr.findIndex(x=>x.id===item.id);
  if(idx>=0)arr[idx]=item;else arr.push(item);
  save();
  cloudUpsert(colKey,item);
}
function removeItem(colKey,id){
  S[colKey]=S[colKey].filter(x=>x.id!==id);
  save();
  cloudRemove(colKey,id);
}
function linkConvite(codigo){
  return location.origin+location.pathname+'?c='+encodeURIComponent(codigo);
}
function compartilharConvite(){
  const link=linkConvite(cloudCfg.codigo);
  if(navigator.share){navigator.share({title:'Finanças a dois',text:'Entra no nosso app de finanças:',url:link}).catch(()=>{})}
  else if(navigator.clipboard){navigator.clipboard.writeText(link).then(()=>alert('Link copiado! Só colar e mandar pro seu par.'))}
  else abrir(`<h1>Convite</h1><div class="mut" style="margin-bottom:10px">Copie e mande esse link:</div><input readonly value="${esc(link)}" onclick="this.select()">`);
}
function abrirConectarCasal(codigoPrefill){
  abrir(`<h1>Conectar com meu par</h1>
  <div class="mut" style="margin-bottom:10px">Toque em Conectar pra ver os mesmos lançamentos do seu par, em tempo real.</div>
  <input id="kn" placeholder="Seu nome (aparece nos lançamentos)" autofocus>
  <input id="kc" placeholder="Código do casal" value="${esc(codigoPrefill||'')}">
  <button class="btn" onclick="salvarConexaoCasal()">Conectar</button>`);
}
async function salvarConexaoCasal(){
  const nome=document.getElementById('kn').value.trim();
  const codigo=document.getElementById('kc').value.trim();
  if(!nome||!codigo){haptic(20);return}
  const completo={...FIREBASE_CFG,codigo,nome};
  saveCloudCfg(completo);cloudCfg=completo;
  try{
    await conectarCloud(completo);
    haptic();flashSucesso();fechar();render();
  }catch(e){
    console.error('[cloud]',e);
    localStorage.removeItem('financas.cloud');cloudCfg=null;db=null;auth=null;FS=null;
    alert('Não consegui conectar agora. Confira sua internet e tente de novo.');
  }
}
function desconectarCloud(force){
  if(!force&&!confirm('Desconectar este aparelho? Os dados continuam salvos na nuvem, só este aparelho para de sincronizar.'))return;
  pararListeners();db=null;auth=null;FS=null;
  localStorage.removeItem('financas.cloud');cloudCfg=null;
  render();
}

/* ---------- regras ---------- */
/* fixos e rendas viram lançamentos virtuais no mês consultado */
/* ajustes por mês: S.ajustes['2026-11']['fx<id>'] = {valor?, ok?}
   muda o valor só daquele mês e marca se já pagou / já caiu. */
function ajusteDe(k,id){return((S.ajustes||{})[k]||{})[id]||null}
function aplicarAjuste(k,o){const a=ajusteDe(k,o.id);if(a){if(a.valor!=null)o.valor=a.valor;o.ok=!!a.ok;o.ajustado=a.valor!=null}return o}
function fixosDoMes(k){
  return S.fixos.filter(f=>!f.ate||f.ate>=k).filter(f=>!f.desde||f.desde<=k).map(f=>({id:'fx'+f.id,fixo:true,tipo:'gasto',valor:f.valor,cat:f.cat,desc:f.desc+(f.parcelaTotal&&f.parcelaInicio?` (${mesesEntre(f.parcelaInicio,k)+1}/${f.parcelaTotal})`:''),cartao:f.cartao||null,autor:f.autor||null,data:k+'-'+String(Math.min(f.dia||1,diasNoMes(k))).padStart(2,'0')})).map(o=>aplicarAjuste(k,o));
}
/* n-ésimo dia útil do mês: pula sábado, domingo e feriados nacionais
   (fixos + Sexta-feira Santa). Feriado estadual/municipal não entra. */
function pascoa(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),l=(32+2*e+2*i-h-(c%4))%7,m=Math.floor((a+11*h+22*l)/451),mes=Math.floor((h+l-7*m+114)/31),dia=((h+l-7*m+114)%31)+1;return new Date(y,mes-1,dia)}
function feriado(d){const md=String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');if(['01-01','04-21','05-01','09-07','10-12','11-02','11-15','11-20','12-25'].includes(md))return true;const sx=pascoa(d.getFullYear());sx.setDate(sx.getDate()-2);return d.getMonth()===sx.getMonth()&&d.getDate()===sx.getDate()}
function diaUtil(k,n){const[y,m]=k.split('-').map(Number);let c=0;for(let dd=1;dd<=diasNoMes(k);dd++){const d=new Date(y,m-1,dd),w=d.getDay();if(w===0||w===6||feriado(d))continue;if(++c===n)return dd}return diasNoMes(k)}
function rendasDoMes(k){
  return S.rendas.filter(r=>!r.ate||r.ate>=k).filter(r=>!r.desde||r.desde<=k).map(r=>({id:'rd'+r.id,fixo:true,tipo:'ganho',valor:r.valor,cat:'Renda',desc:r.desc,diaUtilN:r.diaUtil||null,autor:r.autor||null,data:k+'-'+String(r.diaUtil?diaUtil(k,r.diaUtil):Math.min(r.dia||1,diasNoMes(k))).padStart(2,'0')})).map(o=>aplicarAjuste(k,o));
}
function txMes(k){
  const reais=S.tx.filter(t=>t.data.startsWith(k));
  return reais.concat(fixosDoMes(k)).concat(rendasDoMes(k)).sort((a,b)=>b.data.localeCompare(a.data));
}
function totais(k){
  const l=txMes(k);
  const gasto=l.filter(t=>t.tipo==='gasto').reduce((s,t)=>s+t.valor,0);
  const ganho=l.filter(t=>t.tipo==='ganho').reduce((s,t)=>s+t.valor,0);
  const porCat={},porPessoa={};
  l.filter(t=>t.tipo==='gasto').forEach(t=>porCat[t.cat]=(porCat[t.cat]||0)+t.valor);
  l.filter(t=>t.tipo==='ganho').forEach(t=>{const nome=t.autor||'Sem nome';porPessoa[nome]=(porPessoa[nome]||0)+t.valor});
  return{gasto,ganho,renda:ganho,porCat,porPessoa,saldo:ganho-gasto};
}
function tetoTotal(){return Object.values(S.orc).reduce((a,b)=>a+(+b||0),0)}
function rendaRecorrenteMensal(){return S.rendas.reduce((s,r)=>s+(+r.valor||0),0)}
/* migra o antigo salário único (um campo pro casal todo) pra uma renda
   recorrente nomeada; roda uma vez quando ainda existir o campo antigo. */
function migrarSalarioParaRendas(){
  if(S.salario>0&&(!S.rendas||!S.rendas.length)){
    const valorAntigo=S.salario;
    S.salario=0;
    upsertItem('rendas',{id:uid(),desc:'Renda principal',valor:valorAntigo,autor:cloudCfg?.nome||null,dia:1});
    cloudSaveConfig();
  }
}

/* ---------- distribuição da renda por % ----------
   Cada divisão aponta pra uma categoria (define o teto do orçamento), uma
   meta (vira "sugerido este mês" no card da meta) ou um nome livre (só
   planejamento, sem efeito automático). Base: soma das rendas recorrentes
   (salário, VR...) — bicos avulsos lançados como Entrada não entram na
   base, pra não bagunçar o planejamento com algo variável. */
function valorDistribuicao(pct){return Math.round(rendaRecorrenteMensal()*(+pct||0)/100)}
function totalPctDistribuicao(){return S.distribuicao.reduce((s,d)=>s+(+d.pct||0),0)}
function recomputeOrcFromDistribuicao(){
  S.distribuicao.forEach(d=>{
    if(d.tipo==='cat')S.orc[d.destino]=valorDistribuicao(d.pct);
  });
}
function distribuicaoLabel(d){
  if(d.tipo==='cat')return `${catIcon(d.destino)} ${d.destino}`;
  if(d.tipo==='meta'){const m=S.metas.find(x=>x.id===d.destino);return `${ic('meta')} ${m?esc(m.nome):'Meta removida'}`}
  return `${ic('editar')} ${esc(d.destino)}`;
}
function podeGastarHoje(k){
  const t=totais(k);
  const base=tetoTotal()>0?tetoTotal():t.renda;
  const sobra=base-t.gasto;
  const d=diasRestantes(k);
  return{sobra,porDia:d>0?sobra/d:0,dias:d,base};
}
/* categoria só com fixos (ex.: Moradia = aluguel + internet) bate 100% do
   teto no dia 1 e isso é o planejado, não um estouro. Vermelho só quando
   passa do teto. */
function soFixo(k,c){const l=txMes(k).filter(t=>t.tipo==='gasto'&&t.cat===c);return l.length>0&&l.every(t=>t.fixo)}
function gastoFixoMes(k){return fixosDoMes(k).reduce((s,t)=>s+t.valor,0)}
function cor(p,fixo){if(p>100.5)return'var(--bad)';if(fixo)return'var(--ok)';return p>=100?'var(--bad)':p>=80?'var(--warn)':'var(--ok)'}

/* ---------- insights: "consultor financeiro" por regras ----------
   Nada de IA aqui — só comparações com o mês anterior e com os tetos.
   Dá pra trocar/complementar por um modelo de IA de verdade depois: é só
   mandar esses mesmos números pra API de um modelo (ex.: Gemini, que tem
   nível grátis) e pedir pra ele escrever o comentário em vez da regra fixa. */
function gerarInsights(k){
  const t=totais(k),ant=totais(addMes(k,-1)),p=podeGastarHoje(k);
  const out=[];
  if(t.saldo<0){
    out.push({tone:'warn',icon:'alerta',texto:`Saldo negativo este mês: ${R(t.saldo)}. Os gastos já passaram as entradas.`});
  }
  let maiorCresceu=null;
  Object.keys(t.porCat).forEach(c=>{
    const delta=(t.porCat[c]||0)-(ant.porCat[c]||0);
    if(ant.gasto>0&&delta>=30&&(!maiorCresceu||delta>maiorCresceu.delta))maiorCresceu={cat:c,delta,de:ant.porCat[c]||0,para:t.porCat[c]};
  });
  if(maiorCresceu){
    out.push({tone:'warn',icon:'subida',texto:`${catIcon(maiorCresceu.cat)} ${maiorCresceu.cat} subiu ${R(maiorCresceu.delta)} em relação ao mês passado (${R(maiorCresceu.de)} → ${R(maiorCresceu.para)}).`});
  }
  Object.entries(t.porCat).forEach(([c,v])=>{
    const teto=+S.orc[c]||0;if(!teto)return;
    const pc=v/teto*100;
    const fx=soFixo(k,c);
    if(pc>100.5||(!fx&&pc>=100))out.push({tone:'warn',icon:'alerta',texto:`${catIcon(c)} ${c} já passou do teto: ${R(v)} de ${R(teto)}.`});
    else if(!fx&&pc>=90)out.push({tone:'info',icon:'info',texto:`${catIcon(c)} ${c} está em ${Math.round(pc)}% do teto (${R(v)} de ${R(teto)}).`});
  });
  if(p.base>0){
    const diasMes=diasNoMes(k),diasPassados=Math.max(1,diasMes-p.dias+1);
    const fxm=gastoFixoMes(k),baseVar=p.base-fxm,pctDias=diasPassados/diasMes*100,pctGasto=baseVar>0?Math.min((t.gasto-fxm)/baseVar*100,999):0;
    if(pctGasto-pctDias>=20){
      out.push({tone:'warn',icon:'relogio',texto:`Já foram ${Math.round(pctGasto)}% do orçamento gastos, mas só ${Math.round(pctDias)}% do mês passou — ritmo acelerado.`});
    }
  }
  if(ant.gasto>0&&t.gasto>0&&t.gasto<ant.gasto*0.9){
    out.push({tone:'ok',icon:'ok',texto:`Você gastou ${Math.round((1-t.gasto/ant.gasto)*100)}% a menos que o mês passado. Mandou bem!`});
  }
  if(k===mesKey(new Date()))avisosFatura().forEach(a=>out.push(a));
  const ordem={warn:0,info:1,ok:2};
  return out.sort((a,b)=>ordem[a.tone]-ordem[b.tone]).slice(0,3);
}

/* ---------- consultor com IA de verdade (Gemini, opcional) ----------
   Manda só números agregados do mês (nada de nome, id ou descrição de
   lançamento) pro Gemini escrever um comentário curto. Se falhar (sem
   internet, cota, etc.) some em silêncio e os conselhos por regra acima
   continuam valendo sozinhos. */
let iaCache={},iaPendente={};
function resumoParaIA(k){
  const t=totais(k),ant=totais(addMes(k,-1));
  return{gastoTotal:t.gasto,rendaTotal:t.renda,saldo:t.saldo,gastoPorCategoria:t.porCat,gastoMesPassado:ant.gasto,gastoPorCategoriaMesPassado:ant.porCat,tetosDefinidos:S.orc};
}
function chaveInsightIA(k){return k+'|'+JSON.stringify(resumoParaIA(k))}
/* usa o "lite" do Gemini: o "gemini-3.8-flash" normal tem cota grátis de só
   20 pedidos/dia (estoura rapidinho com o chat + conselhos) e ainda "pensa"
   por dezenas de segundos antes de responder "ok". O lite responde na hora
   e tem cota bem maior. Aborta sozinho se travar. */
async function chamarIA(body,timeoutMs=20000){
  const ctrl=new AbortController();
  const t=setTimeout(()=>ctrl.abort(),timeoutMs);
  try{
    const resp=await fetch(IA_PROXY_URL,{
      method:'POST',headers:{'Content-Type':'application/json'},signal:ctrl.signal,
      body:JSON.stringify({model:'gemini-3.5-flash-lite',...body})
    });
    const data=await resp.json();
    return data?.candidates?.[0]?.content?.parts?.[0]?.text||null;
  }finally{clearTimeout(t)}
}
async function gerarInsightIA(k){
  const chave=chaveInsightIA(k);
  if(iaCache[chave]!==undefined)return{texto:iaCache[chave],chave};
  if(iaPendente[chave])return null;
  iaPendente[chave]=true;
  const resumo=resumoParaIA(k);
  try{
    const texto=await chamarIA({contents:[{parts:[{text:`Você é um consultor financeiro direto, simpático e bem casual, escrevendo em português do Brasil pra um casal que divide as contas. Os campos a seguir são do MÊS ATUAL, já em andamento: gastoTotal, rendaTotal, saldo, gastoPorCategoria, tetosDefinidos. Os campos gastoMesPassado e gastoPorCategoriaMesPassado são só pra efeito de comparação com o mês anterior (se vierem zerados ou vazios, é porque o app é novo, não comente sobre isso). Dados (JSON, valores em reais): ${JSON.stringify(resumo)}. Em até 2 frases curtas, comente o que mais chama atenção no mês ATUAL (sem repetir os números crus) e dê uma dica prática e específica pro resto do mês ou pro próximo. Não use saudação nem se apresente, vá direto ao comentário.`}]}]});
    iaCache[chave]=texto?texto.trim():null;
  }catch(e){
    console.error('[ia]',e);
    iaCache[chave]=null;
  }
  delete iaPendente[chave];
  return{texto:iaCache[chave],chave};
}

/* ---------- consultor em chat (shared, sincronizado por Firebase) ----------
   Cada mensagem é um item igual aos outros (vira doc em casais/{codigo}/chat),
   então já chega em tempo real nos dois aparelhos pelo mesmo listener. Quem
   manda a pergunta é quem busca a resposta da IA (sem fila/lock: não tem como
   dar resposta duplicada, porque cada mensagem só é respondida por quem a
   enviou). */
let chatAberto=false,chatEnviando=false;
/* ---------- lançar conversando ----------
   Entende frases como "gastei 32,90 no lanche no C6", "uber 18 ontem",
   "recebi 50 do Daniel". Primeiro tenta aqui mesmo (rápido e offline);
   se não entender, a IA pode devolver uma linha LANCAR {json}. */
const PALAVRAS_CAT={Comida:['lanche','ifood','almoço','almoco','janta','jantar','pizza','hamburguer','hambúrguer','burger','açaí','acai','café','cafe','padaria','restaurante','mc','mcdonalds','bk','salgado','pastel','sorvete','comida','delivery','marmita','esfiha','sushi'],Mercado:['mercado','supermercado','feira','hortifruti','atacadão','atacadao','assaí','assai'],Transporte:['uber','99','ônibus','onibus','gasolina','combustível','combustivel','passagem','metrô','metro','trem','barca','estacionamento','pedágio','pedagio','moto','bilhete'],Lazer:['cinema','bar','cerveja','show','jogo','rolê','role','festa','balada','praia','ingresso','steam','game','churrasco'],'Saúde':['farmácia','farmacia','remédio','remedio','médico','medico','consulta','dentista','academia'],Compras:['roupa','tênis','tenis','shopee','amazon','shein','presente','loja','camisa','perfume'],Assinaturas:['assinatura','netflix','spotify','crunchyroll','prime','youtube','icloud','claude'],Estudos:['curso','livro','faculdade','apostila'],Moradia:['luz','água','agua','gás','gas','aluguel','internet'],Outros:['função','funcao','barracão','barracao','terreiro','vela','oferenda']};
function normTxt(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function entenderLancamento(texto){
  const t=' '+normTxt(texto)+' ';
  const mv=t.match(/(?:r\$\s*)?(\d{1,5}(?:[.,]\d{1,2})?)\s*(?:reais|real|conto|pila|r\$)?/);
  if(!mv)return null;
  const valor=parseFloat(mv[1].replace(',','.'));if(!(valor>0))return null;
  const entrada=/\b(recebi|ganhei|caiu|entrou|me pagou|me pagaram|devolveu)\b/.test(t);
  const verbo=/\b(gastei|paguei|comprei|torrei|gasto|foi|foram|deu|saiu)\b/.test(t);
  let cat=null,palavra=null;
  for(const[c,ws]of Object.entries(PALAVRAS_CAT)){for(const w of ws){const nw=normTxt(w);if(new RegExp('(^|[^a-z0-9])'+nw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'([^a-z0-9]|$)').test(t)){cat=c;palavra=w;break}}if(cat)break}
  if(!entrada&&!verbo&&!cat)return null;
  const cartao=S.cartoes.find(c=>new RegExp('(^|[^a-z0-9])'+normTxt(c.nome).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'([^a-z0-9]|$)').test(t));
  const d=new Date();if(/\bontem\b/.test(t))d.setDate(d.getDate()-1);if(/\banteontem\b/.test(t))d.setDate(d.getDate()-1);
  const data=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  let desc=palavra?palavra.charAt(0).toUpperCase()+palavra.slice(1):'';
  const md=texto.match(/\b(?:no|na|em|com|de|do|da)\s+([A-Za-zÀ-ú][\wÀ-ú]*(?:\s+[A-Za-zÀ-ú][\wÀ-ú]*)?)/);
  if(!desc&&md&&!(cartao&&normTxt(md[1]).includes(normTxt(cartao.nome))))desc=md[1];
  if(entrada)return{tipo:'ganho',valor,cat:'Entrada',desc:desc||'Entrada',cartao:null,data};
  return{tipo:'gasto',valor,cat:cat||'Outros',desc,cartao:cartao?cartao.id:null,data};
}
function lancarDaConversa(o){
  const tx={id:uid(),tipo:o.tipo,valor:Math.round(o.valor*100)/100,cat:o.tipo==='ganho'?'Entrada':o.cat,desc:o.desc||'',cartao:o.tipo==='gasto'?(o.cartao||null):null,autor:cloudCfg?.nome||null,data:o.data||hojeStr()};
  upsertItem('tx',tx);
  const k=tx.data.slice(0,7),dd=diaADia(k),c=dd.cats.find(x=>x.cat===tx.cat);
  const cc=tx.cartao?S.cartoes.find(x=>x.id===tx.cartao):null;
  let msg=tx.tipo==='ganho'?`Anotado: entrada de ${R(tx.valor)}${tx.desc?` (${tx.desc})`:''}.`:`Lancei ${R(tx.valor)} em ${tx.cat}${tx.desc?` (${tx.desc})`:''}, ${cc?'no '+cc.nome:'no Pix/dinheiro'}${tx.data!==hojeStr()?', '+rotuloDia(tx.data).toLowerCase():''}.`;
  if(tx.tipo==='gasto'&&k===mesKey(new Date())){
    const resto=dd.teto-dd.gasto,dias=diasRestantes(k);
    if(c&&c.teto&&c.gasto>c.teto)msg+=` Atenção: ${tx.cat} passou do teto (${R(c.gasto)} de ${R(c.teto)}).`;
    else if(c&&c.teto&&c.gasto>=c.teto*.8)msg+=` ${tx.cat} já está em ${Math.round(c.gasto/c.teto*100)}% do teto.`;
    msg+=resto>0?` Dá pra gastar ${R(resto/dias)} por dia até o fim do mês.`:` O dia a dia do mês estourou em ${R(-resto)}.`;
  }
  return{tx,msg};
}
function desfazerLanc(chatId){
  const m=S.chat.find(x=>x.id===chatId);if(!m||!m.txId)return;
  removeItem('tx',m.txId);upsertItem('chat',{...m,txId:null,texto:m.texto+' (desfeito)'});
  haptic(20);renderChatMsgs();render();
}
function chatOrdenado(){return[...S.chat].sort((a,b)=>a.data-b.data)}
function construirSystemPromptChat(){
  const r=resumoParaIA(mesRef);
  const rendas=S.rendas.map(x=>`${x.desc} (${esc(x.autor||'sem nome')}): ${R(x.valor)}`).join('; ')||'nenhuma';
  const metas=S.metas.map(m=>`${m.nome}: ${R(m.atual)} de ${R(m.alvo)}`).join('; ')||'nenhuma';
  const k0=mesKey(new Date()),dd=diaADia(k0),resto=dd.teto-dd.gasto;
  const pend=txMes(k0).filter(pendente).map(x=>`${x.desc} ${R(x.valor)} dia ${+x.data.slice(8)} (${x.tipo==='ganho'?'a receber':'a pagar'})`).join('; ')||'nenhuma';
  const fat=faturasProximas().filter(f=>f.total>0).map(f=>`${f.nome} ${R(f.total)} vence ${f.vence}`).join('; ')||'nenhuma';
  const cats=dd.cats.map(c=>`${c.cat} ${R(c.gasto)} de ${R(c.teto)}`).join('; ');
  const extra=` Hoje é ${hojeStr()}. Dia a dia (gastos variáveis) do mês: usado ${R(dd.gasto)} de ${R(dd.teto)}, sobra ${R(resto)}, dá ${R(resto/diasRestantes(k0))} por dia; por categoria: ${cats}. Contas ainda pendentes: ${pend}. Faturas: ${fat}. Cartões: ${S.cartoes.map(c=>c.nome).join(', ')||'nenhum'}. Se a pessoa estiver contando um gasto ou uma entrada pra registrar, comece a resposta com uma linha exatamente assim: LANCAR {"tipo":"gasto" ou "ganho","valor":número,"cat":uma de ${JSON.stringify(CATS.map(c=>c[1]))},"desc":"curta","cartao":"nome do cartão ou null","data":"AAAA-MM-DD"} e depois, na linha seguinte, um comentário curto. Se não for registro, não use LANCAR.`;
  return `Você é um consultor financeiro direto, simpático e bem casual, batendo papo em português do Brasil num chat compartilhado entre um casal que divide as contas. Os dois podem escrever nesse mesmo chat; cada mensagem de usuário vem prefixada com o nome de quem escreveu. Use os dados reais abaixo pra responder dúvidas e dar conselhos, sem inventar números. Mês atual (R$): gasto total ${r.gastoTotal}, renda total ${r.rendaTotal}, saldo ${r.saldo}, gasto por categoria ${JSON.stringify(r.gastoPorCategoria)}, tetos definidos ${JSON.stringify(r.tetosDefinidos)}. Rendas recorrentes: ${rendas}. Metas: ${metas}. Responda curto (até 3-4 frases), sem saudação nem se apresentar, direto ao ponto.`+extra;
}
function falarDaHoje(){
  const i=document.getElementById('conversaHoje'),v=i.value.trim();if(!v)return abrirChat();
  i.value='';abrirChat();const ci=document.getElementById('chatInput');ci.value=v;enviarChat();
}
function abrirChat(){
  chatAberto=true;
  const overlay=document.createElement('div');
  overlay.className='chatOverlay';
  overlay.id='chatOverlay';
  overlay.innerHTML=`<div class="chatHead"><div class="chatTitle">${ic('ia',20)} Consultor IA</div><button class="x" onclick="fecharChat()">×</button></div>
  <div class="chatMsgs" id="chatMsgs"></div>
  <div class="chatInputBar"><input id="chatInput" placeholder='Ex.: gastei 30 no ifood' maxlength="500" onkeydown="if(event.key==='Enter'){event.preventDefault();enviarChat()}"><button class="chatSend" onclick="enviarChat()">${ic('enviar',18)}</button></div>`;
  document.body.appendChild(overlay);
  requestAnimationFrame(()=>overlay.classList.add('show'));
  renderChatMsgs();
  atualizarChatBadge();
  document.getElementById('chatInput').focus();
}
function fecharChat(){
  chatAberto=false;
  const overlay=document.getElementById('chatOverlay');
  if(overlay){overlay.classList.remove('show');setTimeout(()=>overlay.remove(),260)}
}
function renderChatMsgs(){
  const box=document.getElementById('chatMsgs');
  if(!box)return;
  const meu=cloudCfg?.nome||null;
  const lista=chatOrdenado();
  const pertoDoFim=box.scrollHeight-box.scrollTop-box.clientHeight<80;
  let h=lista.map(m=>{
    if(m.role==='ia')return `<div class="chatRow ia"><span class="chatIaIc">${ic('ia',16)}</span><div><div class="chatBubble ia">${esc(m.texto)}</div>${m.txId&&S.tx.some(x=>x.id===m.txId)?`<div class="chatAcoes"><button onclick="desfazerLanc('${m.id}')">Desfazer</button><button onclick="fecharChat();editarLanc('${m.txId}')">Editar</button></div>`:''}</div></div>`;
    const mine=m.autor===meu;
    return `<div class="chatRow ${mine?'mine':'theirs'}">${!mine&&m.autor?`<div class="chatAutor">${esc(m.autor)}</div>`:''}<div class="chatBubble ${mine?'mine':'theirs'}">${esc(m.texto)}</div></div>`;
  }).join('');
  if(chatEnviando)h+=`<div class="chatRow ia"><span class="chatIaIc">${ic('ia',16)}</span><div class="chatTyping"><span></span><span></span><span></span></div></div>`;
  box.innerHTML=h||'<div class="empty">Conta o que gastou do jeito que falaria: "gastei 32 no lanche no C6", "uber 18 ontem". Eu lanço pra você.<br><br>Ou pergunta: "dá pra sair sábado?"</div>';
  if(pertoDoFim)box.scrollTop=box.scrollHeight;
  if(chatAberto){const u=lista[lista.length-1];if(u)localStorage.setItem('financas.chatSeen',String(u.id))}
}
function atualizarChatBadge(){
  const btn=document.getElementById('fabChat');
  if(!btn)return;
  const ultimo=chatOrdenado().slice(-1)[0];
  const visto=localStorage.getItem('financas.chatSeen');
  btn.classList.toggle('badge',!chatAberto&&!!ultimo&&String(ultimo.id)!==visto);
}
async function enviarChat(){
  const inp=document.getElementById('chatInput');
  const texto=inp.value.trim();
  if(!texto||chatEnviando)return;
  inp.value='';
  upsertItem('chat',{id:uid(),autor:cloudCfg?.nome||null,texto,role:'user',data:Date.now()});
  renderChatMsgs();
  haptic(6);
  const direto=entenderLancamento(texto);
  if(direto&&!/\?\s*$/.test(texto)){
    const r=lancarDaConversa(direto);
    upsertItem('chat',{id:uid(),autor:'IA',texto:r.msg,role:'ia',data:Date.now()+1,txId:r.tx.id});
    renderChatMsgs();render();return;
  }
  chatEnviando=true;renderChatMsgs();
  try{
    const historico=chatOrdenado().slice(-12);
    const texto2=await chamarIA({
      systemInstruction:{parts:[{text:construirSystemPromptChat()}]},
      contents:historico.map(m=>({role:m.role==='ia'?'model':'user',parts:[{text:m.role==='ia'?m.texto:`${m.autor||'Pessoa'}: ${m.texto}`}]}))
    },25000);
    let resp=texto2?texto2.trim():'Não consegui responder agora. Tenta de novo em instantes.',txId=null;
    const ml=resp.match(/^LANCAR\s*(\{[^\n]*\})\s*\n?/);
    if(ml){
      resp=resp.slice(ml[0].length).trim();
      try{const j=JSON.parse(ml[1]);const cc=j.cartao&&S.cartoes.find(c=>normTxt(c.nome)===normTxt(j.cartao));
        if(+j.valor>0){const r=lancarDaConversa({tipo:j.tipo==='ganho'?'ganho':'gasto',valor:+j.valor,cat:CATS.some(c=>c[1]===j.cat)?j.cat:'Outros',desc:j.desc||'',cartao:cc?cc.id:null,data:/^\d{4}-\d{2}-\d{2}$/.test(j.data||'')?j.data:hojeStr()});resp=r.msg+(resp?'\n'+resp:'');txId=r.tx.id}}catch(e){}
    }
    upsertItem('chat',{id:uid(),autor:'IA',texto:resp,role:'ia',data:Date.now(),txId});
  }catch(e){
    console.error('[chat-ia]',e);
    upsertItem('chat',{id:uid(),autor:'IA',texto:'Não consegui responder agora. Confira sua internet e tenta de novo.',role:'ia',data:Date.now()});
  }
  chatEnviando=false;
  renderChatMsgs();
}

/* ---------- cartões: ciclo de fatura ---------- */
function diaFechamento(c){return Math.min(Math.max(+c.fechamento||1,1),31)}
function fecharData(c,y,m){
  const k=mesKey(new Date(y,m-1,1));
  const dia=Math.min(diaFechamento(c),diasNoMes(k));
  return k+'-'+String(dia).padStart(2,'0');
}
function addMesYM(y,m,n){const k=addMes(y+'-'+String(m).padStart(2,'0'),n);const[yy,mm]=k.split('-').map(Number);return[yy,mm]}
function cicloAberto(c,ref){
  ref=ref||new Date();
  const y=ref.getFullYear(),m=ref.getMonth()+1,d=ref.getDate();
  const fechEste=fecharData(c,y,m);
  if(d<=+fechEste.slice(8)){
    const[py,pm]=addMesYM(y,m,-1);
    return{inicio:fecharData(c,py,pm),fim:fechEste};
  }
  const[ny,nm]=addMesYM(y,m,1);
  return{inicio:fechEste,fim:fecharData(c,ny,nm)};
}
/* fatura que vence nos próximos 5 dias: a do ciclo que fechou no
   fechamento anterior ao vencimento. */
function faturasProximas(){
  const out=[],hoje=new Date();hoje.setHours(0,0,0,0);
  S.cartoes.filter(c=>c.vencimento).forEach(c=>{
    let v=new Date(hoje.getFullYear(),hoje.getMonth(),c.vencimento);
    if(v<hoje)v=new Date(hoje.getFullYear(),hoje.getMonth()+1,c.vencimento);
    const fm=c.vencimento>c.fechamento?v.getMonth():v.getMonth()-1;
    const fd=new Date(v.getFullYear(),fm,Math.min(c.fechamento,new Date(v.getFullYear(),fm+1,0).getDate()));
    const total=txsCartaoCiclo(c,cicloAberto(c,fd)).reduce((s,t)=>s+t.valor,0);
    out.push({nome:c.nome,vence:v.getFullYear()+'-'+String(v.getMonth()+1).padStart(2,'0')+'-'+String(v.getDate()).padStart(2,'0'),dias:Math.round((v-hoje)/864e5),total});
  });
  return out;
}
function avisosFatura(){
  const out=[],hoje=new Date();hoje.setHours(0,0,0,0);
  S.cartoes.filter(c=>c.vencimento).forEach(c=>{
    let v=new Date(hoje.getFullYear(),hoje.getMonth(),c.vencimento);
    if(v<hoje)v=new Date(hoje.getFullYear(),hoje.getMonth()+1,c.vencimento);
    const dias=Math.round((v-hoje)/864e5);if(dias>5)return;
    const fm=c.vencimento>c.fechamento?v.getMonth():v.getMonth()-1;
    const fd=new Date(v.getFullYear(),fm,Math.min(c.fechamento,new Date(v.getFullYear(),fm+1,0).getDate()));
    const total=txsCartaoCiclo(c,cicloAberto(c,fd)).reduce((s,t)=>s+t.valor,0);
    if(total<=0)return;
    const quando=dias===0?'vence hoje':dias===1?'vence amanhã':`vence em ${dias} dias (dia ${v.getDate()})`;
    out.push({tone:'warn',icon:'alerta',texto:`Fatura do ${esc(c.nome)} ${quando}: ${R(total)}. Pague o valor total pra não cair no rotativo.`});
  });
  return out;
}

function txsCartaoCiclo(c,ciclo){
  const meses=[...new Set([ciclo.inicio.slice(0,7),ciclo.fim.slice(0,7)])];
  const seen=new Set(),out=[];
  meses.forEach(k=>txMes(k).forEach(t=>{
    if(t.tipo!=='gasto'||t.cartao!==c.id)return;
    if(t.data<=ciclo.inicio||t.data>ciclo.fim)return;
    if(seen.has(t.id))return;
    seen.add(t.id);out.push(t);
  }));
  return out.sort((a,b)=>b.data.localeCompare(a.data));
}
function faturaAtual(c){
  const ciclo=cicloAberto(c);
  const txs=txsCartaoCiclo(c,ciclo);
  return{ciclo,txs,total:txs.reduce((s,t)=>s+t.valor,0)};
}

function ring(pct,size,strokeColor){

  <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="var(--card2)" stroke-width="7" fill="none"/>
  <circle class="ringfill" cx="${size/2}" cy="${size/2}" r="${r}" stroke="${strokeColor}" stroke-width="7" fill="none" stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${circ}" data-off="${off}" style="transition:stroke-dashoffset .9s var(--bounce)"/>
  </svg>`;
}

/* o que é "dia a dia" (variável) e o que é conta fixa, por categoria */
function diaADia(k){
  const t=totais(k),fx={};
  fixosDoMes(k).forEach(f=>fx[f.cat]=(fx[f.cat]||0)+f.valor);
  const cats=new Set([...Object.keys(S.orc),...Object.keys(t.porCat)]);
  const out=[];let teto=0,gasto=0;
  cats.forEach(c=>{
    const vt=Math.max(0,(+S.orc[c]||0)-(fx[c]||0)),vg=Math.max(0,(t.porCat[c]||0)-(fx[c]||0));
    if(vt>0.5||vg>0.005){out.push({cat:c,teto:vt,gasto:vg});teto+=vt;gasto+=vg}
  });
  return{cats:out.sort((a,b)=>b.gasto-a.gasto||b.teto-a.teto),teto,gasto};
}
function rotuloDia(iso){
  const h=hojeStr(),d=new Date(iso+'T12:00:00'),o=new Date();o.setDate(o.getDate()-1);
  const ontem=o.getFullYear()+'-'+String(o.getMonth()+1).padStart(2,'0')+'-'+String(o.getDate()).padStart(2,'0');
  if(iso===h)return 'Hoje';if(iso===ontem)return 'Ontem';
  const s=d.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});return s.charAt(0).toUpperCase()+s.slice(1);
}

    h+=`<div class="lin" onclick="editarRenda('${r.id}')"><div class="ico">${catBolha('Entrada')}</div><div class="mid"><div class="tit">${esc(r.desc)}</div><div class="sub">${sub.join(', ')}</div></div><div class="val pos">${R(r.valor)}</div></div>`;
  });
  const pessoas=Object.entries(S.rendas.reduce((acc,r)=>{const n=r.autor||'Sem nome';acc[n]=(acc[n]||0)+(+r.valor||0);return acc},{}));
  if(pessoas.length){
    h+=`<div class="row" style="padding:12px 0 10px;border-top:1px solid var(--line)"><span class="mut">${cloudCfg?'Renda do casal por mês':'Total por mês'}</span><b class="tabular">${R(rendaRecorrenteMensal())}</b></div>`;
    if(pessoas.length>1)pessoas.forEach(([n,v])=>{h+=`<div class="mut">${esc(n)}: ${R(v)}</div>`});
  }

  h+='<button class="btn sec" style="margin:8px 0 0" onclick="editarRenda()">+ Nova renda</button>';

    h+='<div class="card mut">Cadastre uma renda acima pra planejar a divisão por porcentagem (ex.: 30% reserva de emergência).</div>';
  }else{
    h+='<div class="card">';
    if(!S.distribuicao.length)h+='<div class="empty">Nenhuma divisão ainda.<br>Ex.: 30% Reserva de emergência.</div>';
    S.distribuicao.forEach(d=>{
      h+=`<div class="item" onclick="editarDistribuicao('${d.id}')"><div class="row"><span>${distribuicaoLabel(d)}</span><b>${d.pct}% · ${R(valorDistribuicao(d.pct))}</b></div></div>`;
    });
    const totalPct=totalPctDistribuicao();
    h+=`<div class="mut" style="margin-top:8px">${totalPct}% da renda alocado${totalPct>100?' · passou do total!':''}</div>`;
    h+='</div>';
    h+='<button class="btn sec" style="margin:8px 0 0" onclick="editarDistribuicao()">+ Nova divisão</button>';
  }
  return h;
}
function vOrc(){

    h+=`<div class="catrow" onclick="editarOrc('${c}')">${catBolha(c)}<div class="mid"><div class="top"><span>${c}</span><span class="tabular"><b>${R(v)}</b> <span class="mut">de ${teto?R(teto):'definir'}</span></span></div>${teto?`<div class="bar"><i style="width:${Math.min(pc,100)}%;background:${bc}"></i></div>`:''}</div></div>`;

    h+=`<div class="row"><span>Conectado como</span><b>${esc(cloudCfg.nome||'Você')}</b></div>

    <button class="btn" style="margin-top:10px" onclick="compartilharConvite()">Compartilhar convite com meu par</button>

    ${meta?`<div class="mut" style="margin-top:8px">Ligado à meta "${esc(meta.nome)}": ${R(meta.atual)} / ${R(meta.alvo)}</div>`:''}

    h+='<div class="card"><div class="empty">Nenhum cartão ainda.</div></div>';
  }else{
    h+='<div class="ccgrid">';
    S.cartoes.forEach(c=>{
      const[c1,c2]=corParts(c);
      const f=faturaAtual(c);
      const pct=c.limite?Math.min(f.total/c.limite*100,100):0;
      h+=`<div class="ccard" style="background:linear-gradient(135deg,${c1},${c2})" onclick="verCartao('${c.id}')">

      ${c.limite?`<div class="ccbar"><i style="width:${pct}%"></i></div>`:''}
      </div>`;
    });
    h+='</div>';
  }
  h+='<button class="btn sec" style="margin:8px 0 0" onclick="editarCartao()">+ Novo cartão</button>';
  h+='<h2>Gastos fixos e assinaturas</h2><div class="card">';
  if(!S.fixos.length)h+='<div class="empty">Nenhum fixo ainda.</div>';
  S.fixos.forEach(f=>{const cc=f.cartao?S.cartoes.find(c=>c.id===f.cartao):null;h+=`<div class="item" onclick="editarFixo('${f.id}')"><div class="row"><span>${catIcon(f.cat)} ${esc(f.desc)}<div class="mut">todo dia ${f.dia}${f.ate?' até '+f.ate.slice(5)+'/'+f.ate.slice(0,4):''}${cc?' · '+esc(cc.nome):''}</div></span><b>${R(f.valor)}</b></div></div>`});
  h+=`<button class="btn sec" style="margin:12px 0 0" onclick="editarFixo()">+ Novo fixo / parcela</button></div>`;
  h+='<h2>Metas</h2><div class="card">';
  if(!S.metas.length)h+='<div class="empty">Ex.: reserva de emergência.</div>';
  S.metas.forEach(m=>{
    const pc=m.alvo?Math.min(m.atual/m.alvo*100,100):0;
    const d=S.distribuicao.find(x=>x.tipo==='meta'&&x.destino===m.id);
    const sugestao=d?valorDistribuicao(d.pct):0;
    h+=`<div class="item">
    <div onclick="editarMeta('${m.id}')" style="cursor:pointer">
      <div class="row"><span>${ic('meta')} ${esc(m.nome)}</span><b>${R(m.atual)} <span class="mut">/ ${R(m.alvo)}</span></b></div>
      <div class="bar"><i style="width:${pc}%;background:var(--acc)"></i></div>
    </div>
    ${sugestao>0?`<div class="row" style="margin-top:8px"><span class="mut">Sugerido este mês: ${R(sugestao)}</span><button class="btn sec" style="width:auto;padding:6px 12px;margin:0;font-size:12px" onclick="aportarMeta('${m.id}',${sugestao})">+ Registrar</button></div>`:''}
    </div>`;
  });
  h+=`<button class="btn sec" style="margin:12px 0 0" onclick="editarMeta()">+ Nova meta</button></div>`;
  h+=cardNotificacoes();
  h+=`<h2>Backup</h2><div class="card"><div class="mut" style="margin-bottom:10px">Seus dados ficam só neste aparelho${cloudCfg?' (e sincronizados na nuvem do casal)':''}. Se limpar os dados do Safari, perde tudo, então exporte de vez em quando.</div><button class="btn" onclick="exportar()">Exportar backup</button><button class="btn sec" onclick="document.getElementById('imp').click()">Importar backup ou plano</button><input type="file" id="imp" accept=".json,application/json" class="hidden" onchange="importar(this)"></div>`;
  return h;
}

/* ---------- modais ---------- */
function abrir(html){document.getElementById('sheet').innerHTML='<div class="grabber"></div><button class="x" onclick="fechar()">×</button>'+html;document.getElementById('modal').classList.add('show')}

let OC=null;
function editarOcorrencia(id){
  const t=txMes(mesRef).find(x=>x.id===id);if(!t)return;
  const ganho=t.tipo==='ganho',base=(ganho?S.rendas:S.fixos).find(x=>(ganho?'rd':'fx')+x.id===id);
  OC={id,ok:!!t.ok,ganho,baseId:base?base.id:null,padrao:base?base.valor:t.valor};
  abrir(`<h1>${esc(t.desc)}</h1><div class="mut" style="margin-bottom:10px">${nomeMes(mesRef)} · valor de sempre ${R(OC.padrao)}</div>

  <button class="btn ${OC.ok?'':'sec'}" id="ocok" onclick="OC.ok=!OC.ok;this.className='btn '+(OC.ok?'':'sec');this.textContent=OC.ok?'✓ ${ganho?'Já caiu':'Já paguei'}':'${ganho?'Marcar que já caiu':'Marcar que já paguei'}'">${OC.ok?'✓ '+(ganho?'Já caiu':'Já paguei'):(ganho?'Marcar que já caiu':'Marcar que já paguei')}</button>
  <button class="btn" onclick="salvarOcorrencia()">Salvar este mês</button>
  ${t.ajustado?'<button class="btn sec" onclick="salvarOcorrencia(true)">Voltar pro valor de sempre</button>':''}

}
function salvarOcorrencia(resetar){
  const v=numLivre(document.getElementById('ocv').value);
  if(!resetar&&!(v>=0)){haptic(20);return}
  S.ajustes=S.ajustes||{};const m=S.ajustes[mesRef]=S.ajustes[mesRef]||{};
  const a={ok:OC.ok};
  if(!resetar&&Math.abs(v-OC.padrao)>0.004)a.valor=v;
  if(!a.ok&&a.valor==null)delete m[OC.id];else m[OC.id]=a;
  if(!Object.keys(m).length)delete S.ajustes[mesRef];
  save();cloudSaveConfig();haptic();flashSucesso();fechar();render();
}
function editarLanc(id){const t=S.tx.find(x=>x.id===id);if(!t)return;L={tipo:t.tipo,cat:t.cat,cartao:t.cartao||null,id:t.id};formLanc(t)}

function setTipo(t){L.tipo=t;document.getElementById('sg').classList.toggle('on',t==='gasto');document.getElementById('sn').classList.toggle('on',t==='ganho');formLanc(S.tx.find(x=>x.id===L.id)||{valor:document.getElementById('lv').value,desc:document.getElementById('ld').value,data:document.getElementById('ldt').value})}
function setCat(c){L.cat=c;[...document.querySelectorAll('#lc button')].forEach(b=>b.classList.toggle('on',b.textContent.includes(c)))}
function setCartaoPg(id){haptic(6);L.cartao=id||null;const row=document.getElementById('lp');if(row)[...row.querySelectorAll('button')].forEach(b=>b.classList.toggle('on',(b.dataset.cartao||'')===(id||'')))}
function num(v){const n=parseFloat(String(v).replace(/\./g,'').replace(',','.'));return isFinite(n)?n:NaN}
function numLivre(v){v=String(v).trim();if(v.includes(',')){return num(v)}const n=parseFloat(v);return isFinite(n)?n:NaN}
function salvarLanc(){
  const v=numLivre(document.getElementById('lv').value);
  if(!(v>0)){document.getElementById('lv').style.outline='2px solid var(--bad)';haptic(20);return}
  const antigo=L.id?S.tx.find(x=>x.id===L.id):null;
  const o={id:L.id||uid(),tipo:L.tipo,valor:Math.round(v*100)/100,cat:L.tipo==='ganho'?'Entrada':L.cat,desc:document.getElementById('ld').value.trim(),cartao:L.tipo==='gasto'?(L.cartao||null):null,autor:(antigo&&antigo.autor)||cloudCfg?.nome||null,data:document.getElementById('ldt').value||hojeStr()};
  upsertItem('tx',o);

}
function apagarLanc(){if(confirm('Apagar este lançamento?')){removeItem('tx',L.id);haptic(20);fechar();render()}}

function editarOrc(c){

function salvarRenda(){

let DI=null,DIType=null;
function distribDestinoHtml(tipo,destino){

  if(tipo==='meta'){
    if(!S.metas.length)return '<div class="mut" style="margin-bottom:10px">Crie uma meta primeiro em "Metas", logo abaixo.</div>';
    return `<select id="ddsel">${S.metas.map(m=>`<option value="${m.id}" ${m.id===destino?'selected':''}>${esc(m.nome)}</option>`).join('')}</select>`;
  }
  return `<input id="ddsel" placeholder="Nome (ex.: Investimentos)" value="${esc(destino||'')}">`;
}
function setTipoDistrib(tipo){
  DIType=tipo;

function salvarDistribuicao(){
  const tipo=DIType||'cat';

function aportarMeta(id,valor){

/* ---------- simulador de morar juntos ---------- */

}
function salvarSimuladorMudanca(){
  const aluguel=numLivre(document.getElementById('mua').value)||0;
  const contas=numLivre(document.getElementById('muc').value)||0;
  const custoInicial=numLivre(document.getElementById('mui').value)||0;
  const dataAlvo=document.getElementById('mud').value;
  if(!(custoInicial>0)||!dataAlvo){haptic(20);return}
  const metaIdAntigo=S.mudanca?.metaId;
  const metaExistente=metaIdAntigo&&S.metas.find(m=>m.id===metaIdAntigo);
  const meta={id:metaExistente?metaExistente.id:uid(),nome:'Morar juntos',alvo:custoInicial,atual:metaExistente?.atual||0};
  upsertItem('metas',meta);
  const meses=Math.max(1,mesesEntre(mesKey(new Date()),dataAlvo));
  const porPessoa=(custoInicial/meses)/2;
  const rendaRec=rendaRecorrenteMensal();
  if(rendaRec>0){
    const pct=Math.min(100,Math.max(1,Math.round(porPessoa/rendaRec*100)));
    const distAntiga=S.distribuicao.find(d=>d.tipo==='meta'&&d.destino===meta.id);
    const dist={id:distAntiga?distAntiga.id:uid(),tipo:'meta',destino:meta.id,pct};
    S.distribuicao=distAntiga?S.distribuicao.map(d=>d.id===dist.id?dist:d):[...S.distribuicao,dist];
  }
  S.mudanca={aluguel,contas,custoInicial,dataAlvo,metaId:meta.id};
  save();cloudSaveConfig();haptic();flashSucesso();fechar();render();
}
function apagarSimuladorMudanca(){
  if(!confirm('Apagar a simulação? A meta "Morar juntos" continua existindo, só para de receber sugestão automática.'))return;
  if(S.mudanca?.metaId)S.distribuicao=S.distribuicao.filter(d=>!(d.tipo==='meta'&&d.destino===S.mudanca.metaId));
  S.mudanca=null;
  save();cloudSaveConfig();haptic(20);fechar();render();
}
let F=null;
function editarFixo(id){
  F=id?S.fixos.find(f=>f.id===id):null;const f=F||{cat:'Assinaturas',dia:1};
  const pagOpts=`<option value="">Dinheiro/Pix</option>${S.cartoes.map(c=>`<option value="${c.id}" ${f.cartao===c.id?'selected':''}>${esc(c.nome)}</option>`).join('')}`;
  abrir(`<h1>${F?'Editar':'Novo'} fixo</h1>
  <input id="fd" placeholder="Nome (ex.: Netflix, parcela do celular)" value="${esc(f.desc||'')}">
  <input id="fv" inputmode="decimal" placeholder="Valor (R$)" value="${f.valor||''}">
  <select id="fc">${CATS.map(([i,c])=>`<option ${c===f.cat?'selected':''}>${c}</option>`).join('')}</select>
  <input id="fdia" type="number" min="1" max="31" placeholder="Dia do mês" value="${f.dia||1}">
  ${S.cartoes.length?`<div class="mut" style="margin-bottom:6px">Forma de pagamento</div><select id="ffp">${pagOpts}</select>`:''}
  <div class="mut" style="margin-bottom:6px">Parcelado? Diga qual parcela é em ${nomeMes(mesRef)} e o total — o app calcula o último mês e mostra "4/18".</div>
  <div class="row" style="gap:8px"><input id="fpn" type="number" min="1" placeholder="Parcela nº" value="${f.parcelaTotal&&f.parcelaInicio?mesesEntre(f.parcelaInicio,mesRef)+1:''}"><input id="fpt" type="number" min="1" placeholder="de (total)" value="${f.parcelaTotal||''}"></div>
  <div class="mut" style="margin-bottom:6px">Ou o último mês. Deixe tudo vazio se for permanente.</div>
  <input id="fate" type="month" value="${f.ate||''}">
  <button class="btn" onclick="salvarFixo()">Salvar</button>
  ${F?'<button class="btn del" onclick="apagarFixo()">Apagar</button>':''}`);
}
function salvarFixo(){
  const v=numLivre(document.getElementById('fv').value),d=document.getElementById('fd').value.trim();
  if(!(v>0)||!d)return;
  const fp=document.getElementById('ffp');
  const o={...(F||{}),id:F?F.id:uid(),desc:d,valor:v,cat:document.getElementById('fc').value,dia:Math.min(Math.max(+document.getElementById('fdia').value||1,1),31),ate:document.getElementById('fate').value||'',cartao:fp?(fp.value||null):null,autor:(F&&F.autor)||cloudCfg?.nome||null,desde:F?F.desde:mesKey(new Date())};
  const pn=+document.getElementById('fpn').value||0,pt=+document.getElementById('fpt').value||0;
  if(pn>0&&pt>=pn){o.parcelaTotal=pt;o.parcelaInicio=addMes(mesRef,-(pn-1));o.ate=addMes(o.parcelaInicio,pt-1);if(!o.desde||o.desde>mesRef)o.desde=mesRef}
  else if(!pn&&!pt){o.parcelaTotal=null;o.parcelaInicio=null}
  upsertItem('fixos',o);
  haptic();flashSucesso();fechar();render();
}
function apagarFixo(){if(confirm('Apagar este fixo?')){removeItem('fixos',F.id);haptic(20);fechar();render()}}
let M=null;
function editarMeta(id){
  M=id?S.metas.find(m=>m.id===id):null;const m=M||{};
  abrir(`<h1>${M?'Editar':'Nova'} meta</h1><input id="mn" placeholder="Nome (ex.: Reserva de emergência)" value="${esc(m.nome||'')}"><input id="ma" inputmode="decimal" placeholder="Quanto quer juntar (R$)" value="${m.alvo||''}"><input id="mt" inputmode="decimal" placeholder="Quanto já tem (R$)" value="${m.atual||''}"><button class="btn" onclick="salvarMeta()">Salvar</button>${M?'<button class="btn del" onclick="apagarMeta()">Apagar</button>':''}`);
}
function salvarMeta(){

  if(!n||!(a>0))return;

  upsertItem('metas',o);
  haptic();flashSucesso();fechar();render();
}
function apagarMeta(){if(confirm('Apagar esta meta?')){removeItem('metas',M.id);haptic(20);fechar();render()}}

/* ---------- cartões: formulário e detalhe ---------- */
let CA=null,CAcor=null;
function paletaHtml(sel){
  return `<div class="chips" id="ccor">${CARD_COLORS.map(([a,b])=>{
    const val=a+'|'+b;
    return `<button type="button" data-cor="${val}" class="swatch ${sel===val?'on':''}" style="background:linear-gradient(135deg,${a},${b})" onclick="setCorCartao('${val}')"></button>`;
  }).join('')}</div>`;
}
function setCorCartao(val){haptic(6);CAcor=val;[...document.querySelectorAll('#ccor button')].forEach(b=>b.classList.toggle('on',b.dataset.cor===val))}
function editarCartao(id){
  CA=id?S.cartoes.find(c=>c.id===id):null;
  const c=CA||{fechamento:5};
  CAcor=c.cor||(CARD_COLORS[0][0]+'|'+CARD_COLORS[0][1]);
  abrir(`<h1>${CA?'Editar':'Novo'} cartão</h1>
  <input id="cn" placeholder="Nome (ex.: Nubank, Inter)" value="${esc(c.nome||'')}" autofocus>
  <input id="cf" placeholder="Final (4 dígitos, opcional)" inputmode="numeric" maxlength="4" value="${esc(c.final||'')}">
  <input id="cl" inputmode="decimal" placeholder="Limite (R$)" value="${c.limite||''}">
  <input id="cd" type="number" min="1" max="31" placeholder="Dia de fechamento da fatura" value="${c.fechamento||5}">
  <input id="cv" type="number" min="1" max="31" placeholder="Dia de vencimento da fatura (opcional)" value="${c.vencimento||''}">
  <div class="mut" style="margin:4px 0 8px">Cor do cartão</div>
  ${paletaHtml(CAcor)}
  <button class="btn" onclick="salvarCartao()">Salvar</button>
  ${CA?'<button class="btn del" onclick="apagarCartao()">Apagar cartão</button>':''}`);
}
function salvarCartao(){
  const nome=document.getElementById('cn').value.trim();
  const limite=numLivre(document.getElementById('cl').value);
  if(!nome||!(limite>0)){haptic(20);return}
  const final=document.getElementById('cf').value.replace(/\D/g,'').slice(0,4);
  const fechamento=Math.min(Math.max(+document.getElementById('cd').value||1,1),31);
  const vv=document.getElementById('cv').value;
  const vencimento=vv?Math.min(Math.max(+vv||1,1),31):null;
  const o={id:CA?CA.id:uid(),nome,final,limite,fechamento,vencimento,cor:CAcor};
  upsertItem('cartoes',o);
  haptic();flashSucesso();fechar();render();
}
function apagarCartao(){
  if(!CA)return;
  if(confirm('Apagar este cartão? Os lançamentos ficam, só perdem o vínculo com ele.')){
    const id=CA.id;
    removeItem('cartoes',id);
    S.tx.forEach(t=>{if(t.cartao===id){t.cartao=null;upsertItem('tx',t)}});
    S.fixos.forEach(f=>{if(f.cartao===id){f.cartao=null;upsertItem('fixos',f)}});
    haptic(20);fechar();render();
  }
}
function verCartao(id){
  const c=S.cartoes.find(x=>x.id===id);if(!c)return;
  const[c1,c2]=corParts(c);
  const f=faturaAtual(c);
  const pct=c.limite?Math.min(f.total/c.limite*100,100):0;
  let h=`<div class="ccard big" style="background:linear-gradient(135deg,${c1},${c2})">
  <div class="ccname">${esc(c.nome)}</div>
  <div class="ccnum">•••• ${esc(c.final||'----')}</div>
  </div>`;
  h+=`<div class="card">
  <div class="row"><span class="mut">Fatura em aberto</span><b class="tabular" style="font-size:20px">${R(f.total)}</b></div>
  ${c.limite?`<div class="bar"><i style="width:${pct}%;background:${cor(pct)}"></i></div><div class="mut" style="margin-top:6px">${Math.round(pct)}% de ${R(c.limite)} · fecha dia ${c.fechamento}${c.vencimento?' · vence dia '+c.vencimento:''}</div>`:`<div class="mut" style="margin-top:6px">Sem limite definido · fecha dia ${c.fechamento}${c.vencimento?' · vence dia '+c.vencimento:''}</div>`}
  </div>`;
  h+='<h2>Lançamentos no ciclo</h2><div class="card">';
  if(!f.txs.length)h+='<div class="empty">Nada lançado neste ciclo ainda.</div>';
  f.txs.forEach(t=>{
    const d=t.data.slice(8)+'/'+t.data.slice(5,7);
    h+=`<div class="item"><div class="row"><div>${catIcon(t.cat)} ${esc(t.desc||t.cat)}${t.fixo?' <span class="mut">(fixo)</span>':''}<div class="mut">${d}${t.autor?' · '+esc(t.autor):''}</div></div><b class="tabular">-${R(t.valor).replace('-','')}</b></div></div>`;
  });
  h+='</div>';
  h+=`<button class="btn sec" onclick="editarCartao('${c.id}')">Editar cartão</button>`;
  abrir(h);
}

/* ---------- backup ---------- */
function exportar(){
  const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
  const f=new File([blob],'financas-backup-'+hojeStr()+'.json',{type:'application/json'});

  else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=f.name;a.click()}

/* Plano: arquivo {tipo:'plano'} que SOMA ao que já existe em vez de
   substituir. Cartões, fixos e rendas com o mesmo nome são atualizados
   (não duplicam); fixos apontam pro cartão pelo nome; o orçamento só mexe
   nas categorias que o plano traz. Assim dá pra aplicar o plano de cada
   mês sem perder lançamentos. */
function mesclarPlano(p){
  const norm=s=>String(s||'').trim().toLowerCase();
  const autor=cloudCfg?.nome||null;
  const idCartao={};
  (p.cartoes||[]).forEach(c=>{
    const ex=S.cartoes.find(x=>norm(x.nome)===norm(c.nome));
    const o=ex?{...ex,limite:c.limite,...(c.fechamento?{fechamento:c.fechamento}:{}),...(c.vencimento?{vencimento:c.vencimento}:{})}:{id:uid(),nome:c.nome,final:'',limite:c.limite,fechamento:c.fechamento||1,vencimento:c.vencimento||null,cor:c.cor||CARD_COLORS[S.cartoes.length%CARD_COLORS.length].join('|')};
    upsertItem('cartoes',o);idCartao[norm(c.nome)]=o.id;
  });
  (p.rendas||[]).forEach(r=>{
    const ex=S.rendas.find(x=>norm(x.desc)===norm(r.desc));
    upsertItem('rendas',{...(ex||{}),id:ex?ex.id:uid(),desc:r.desc,valor:r.valor,autor:(ex&&ex.autor)||autor,dia:r.dia||1,diaUtil:r.diaUtil||null,ate:r.ate||'',desde:ex?ex.desde:(r.desde||mesKey(new Date()))});
  });
  (p.fixos||[]).forEach(f=>{
    const ex=S.fixos.find(x=>norm(x.desc)===norm(f.desc));
    upsertItem('fixos',{id:ex?ex.id:uid(),desc:f.desc,valor:f.valor,cat:f.cat,dia:f.dia||1,ate:f.ate||'',cartao:f.cartao?(idCartao[norm(f.cartao)]||null):null,parcelaTotal:f.parcelaTotal||(ex&&ex.parcelaTotal)||null,parcelaInicio:f.parcelaInicio||(ex&&ex.parcelaInicio)||null,autor:(ex&&ex.autor)||autor,desde:ex?ex.desde:(f.desde||mesKey(new Date()))});
  });
  (p.metas||[]).forEach(m=>{
    const ex=S.metas.find(x=>norm(x.nome)===norm(m.nome));
    upsertItem('metas',{id:ex?ex.id:uid(),nome:m.nome,alvo:m.alvo,atual:m.atual!=null?m.atual:(ex?ex.atual:0)});
  });
  Object.entries(p.orc||{}).forEach(([c,v])=>S.orc[c]=v);
  /* remover: {cartoes:['Nubank'], metas:['...'], fixos:[...], rendas:[...]} por nome */
  const rm=p.remover||{},campo={cartoes:'nome',metas:'nome',fixos:'desc',rendas:'desc'};
  Object.entries(campo).forEach(([col,k])=>(rm[col]||[]).forEach(nome=>S[col].filter(x=>norm(x[k])===norm(nome)).forEach(x=>{
    if(col==='cartoes')S.fixos.filter(f=>f.cartao===x.id).forEach(f=>upsertItem('fixos',{...f,cartao:null}));
    removeItem(col,x.id);
  })));
  save();cloudSaveConfig();
}
/* backup substitui tudo: na nuvem do casal também apaga o que não está
   no arquivo e sobe o que está, senão os itens antigos voltariam. */
function substituirNaNuvem(antes){
  if(!cloudCfg)return;
  ['tx','fixos','metas','cartoes','rendas','chat'].forEach(col=>{
    const novos=new Set((S[col]||[]).map(x=>String(x.id)));
    (antes[col]||[]).forEach(x=>{if(!novos.has(String(x.id)))cloudRemove(col,x.id)});
    (S[col]||[]).forEach(x=>cloudUpsert(col,x));
  });
  cloudSaveConfig();
}
function importar(inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);
    if(d.tipo==='plano'){
      const n=k=>(d[k]||[]).length;
      if(confirm(`Aplicar "${d.nome||'plano'}"?\n\nSoma ao que você já tem: ${n('rendas')} rendas, ${n('fixos')} gastos fixos, ${n('cartoes')} cartões, ${n('metas')} metas e o orçamento por categoria.${d.remover?'\n\nRemove: '+Object.values(d.remover).flat().join(', ')+'.':''}`)){mesclarPlano(d);haptic();flashSucesso();tab='hoje';render()}
      return;
    }
    if(!Array.isArray(d.tx))throw 0;if(confirm('Substituir seus dados atuais pelo backup?')){const antes=S;S=Object.assign({},def,d);save();substituirNaNuvem(antes);render()}}catch(e){alert('Arquivo inválido.')}};
  r.readAsText(f);inp.value='';
}
